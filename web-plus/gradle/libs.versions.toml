# ╔═══════════════════════════════════════════════════════════════════════════════════════════════════╗
# ║                                    versions —— 统一版本管理区                                      ║
# ║             所有依赖版本集中在这里统一维护，避免在模块构建脚本中散落硬编码版本                              ║
# ╚═══════════════════════════════════════════════════════════════════════════════════════════════════╝

[versions]

# ─────────────────────────── Spring 体系 ───────────────────────────
spring-boot = "4.1.1"          # Spring Boot 4.1.1 稳定补丁，统一托管 Spring Framework 7.0.9、Spring Data 2026.0.1、Security 7.1.1、Jackson 3.1.5 等版本；需重点验证自动配置和安全链路
spring-cloud = "2025.1.2"      # Spring Cloud 2025.1 补丁线，供 web-plus-mq 的 Stream Kafka 依赖使用；需关注 Stream 5.0.2 与 Boot 4.1 的兼容性

# ─────────────────────────── Web / 文档 / 文件处理 ─────────────────
springdoc = "3.1.0"            # SpringDoc OpenAPI WebFlux UI，供 web-plus-doc 和 web-plus-web 使用
swagger-core = "2.2.54"        # Swagger Core 注解，供 web-plus-core 的 DTO/VO Schema 元数据使用；需与 SpringDoc 传递版本保持兼容
fastexcel = "1.3.0"            # FastExcel 导入导出，供 web-plus-excel 使用
poi = "5.5.1"                  # Apache POI，供 Excel/Office 扩展能力使用；升级需验证 FastExcel 读写兼容性

# ─────────────────────────── 安全 / 映射 / 工具库 ───────────────────
jjwt = "0.13.0"                # JJWT，供 web-plus-security 的 Token 签发与解析使用；升级需验证 JWT 构造、解析和异常类型兼容性
mapstruct-plus = "1.5.1"       # MapStruct Plus，供 web-plus-web 暴露对象映射集成
hutool = "5.8.47"              # Hutool 工具集，供 web-plus-core 的通用工具能力使用
bouncycastle = "1.85.2"        # Bouncy Castle 最新稳定安全补丁，供 web-plus-web 接口加密默认 SM4-CBC-SM3 策略运行时使用

# ─────────────────────────── 任务调度 ──────────────────────────────
powerjob = "5.1.2"             # PowerJob Worker SDK，供 web-plus-job 公共处理器使用

# ─────────────────────────── 测试 ────────────────────────────────
junit = "6.1.2"                # JUnit 6.1 最新已发布稳定补丁

# ─────────────────────────── Gradle 插件 ─────────────────────────
lombok-plugin = "9.5.0"        # Lombok Gradle 插件
lombok = "1.18.46"             # Lombok 编译期注解处理器
versions-plugin = "0.61.0"     # Ben Manes Versions Plugin：依赖更新检查
maven-publish-plugin = "0.37.0" # Vanniktech Maven Publish：Central Portal 上传与内存 GPG 签名

[libraries]

# ═══════════════════════════ Spring Boot 核心与 Starter ═══════════════════════════
# Spring Boot BOM 只做版本托管，不直接引入运行时 jar
spring-boot-dependencies = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "spring-boot" }
# 自动配置注解、条件装配和配置元数据处理器
spring-boot-autoconfigure = { group = "org.springframework.boot", name = "spring-boot-autoconfigure" }
spring-boot-configuration-processor = { group = "org.springframework.boot", name = "spring-boot-configuration-processor" }
# Web Plus 各能力模块使用的 Boot Starter
spring-boot-starter-json = { group = "org.springframework.boot", name = "spring-boot-starter-json" }
spring-boot-starter-webflux = { group = "org.springframework.boot", name = "spring-boot-starter-webflux" }
spring-boot-starter-security = { group = "org.springframework.boot", name = "spring-boot-starter-security" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }
spring-boot-starter-data-redis-reactive = { group = "org.springframework.boot", name = "spring-boot-starter-data-redis-reactive" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
# WebClient 自动配置扩展 SPI，供全局 TraceId 出站过滤器使用。
spring-boot-webclient = { group = "org.springframework.boot", name = "spring-boot-webclient" }

# ═══════════════════════════ Spring Cloud 消息 ═══════════════════════════
# Spring Cloud BOM 与 Stream Kafka Binder，供 web-plus-mq 使用
spring-cloud-dependencies = { group = "org.springframework.cloud", name = "spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-starter-stream-kafka = { group = "org.springframework.cloud", name = "spring-cloud-starter-stream-kafka" }

# ═══════════════════════════ Spring Framework 基础设施 ═══════════════════════════
# 由 Spring Boot BOM 托管版本，按模块公开 API 或内部实现选择 api / implementation / compileOnly
spring-web = { group = "org.springframework", name = "spring-web" }
spring-context = { group = "org.springframework", name = "spring-context" }
spring-core = { group = "org.springframework", name = "spring-core" }
spring-beans = { group = "org.springframework", name = "spring-beans" }
spring-expression = { group = "org.springframework", name = "spring-expression" }
spring-aop = { group = "org.springframework", name = "spring-aop" }
spring-tx = { group = "org.springframework", name = "spring-tx" }
aspectjweaver = { group = "org.aspectj", name = "aspectjweaver" }
reactor-core = { group = "io.projectreactor", name = "reactor-core" }
micrometer-context-propagation = { group = "io.micrometer", name = "context-propagation" }
micrometer-tracing = { group = "io.micrometer", name = "micrometer-tracing" }
# Spring Cloud Stream 5 的 Observation 支持要求显式提供 Reactor Micrometer 集成。
reactor-core-micrometer = { group = "io.projectreactor", name = "reactor-core-micrometer" }

# ═══════════════════════════ Spring Security / Data / Jakarta ═══════════════════════════
# 安全、Redis、JPA API 和 Jakarta API 作为 Web Plus 的可选基础能力，版本由 BOM 托管
spring-security-core = { group = "org.springframework.security", name = "spring-security-core" }
spring-security-web = { group = "org.springframework.security", name = "spring-security-web" }
spring-security-config = { group = "org.springframework.security", name = "spring-security-config" }
spring-data-redis = { group = "org.springframework.data", name = "spring-data-redis" }
spring-data-commons = { group = "org.springframework.data", name = "spring-data-commons" }
jakarta-persistence-api = { group = "jakarta.persistence", name = "jakarta.persistence-api" }
jakarta-validation-api = { group = "jakarta.validation", name = "jakarta.validation-api" }
hibernate-core = { group = "org.hibernate.orm", name = "hibernate-core" }

# ═══════════════════════════ 文档、Excel 与任务调度 ═══════════════════════════
# 这些依赖只在对应能力模块直接使用，聚合 starter 通过模块依赖传递
mapstruct-plus-spring-boot-starter = { group = "io.github.linpeilie", name = "mapstruct-plus-spring-boot-starter", version.ref = "mapstruct-plus" }
springdoc-openapi-starter-webflux-ui = { group = "org.springdoc", name = "springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
swagger-annotations-jakarta = { group = "io.swagger.core.v3", name = "swagger-annotations-jakarta", version.ref = "swagger-core" }
fastexcel = { group = "cn.idev.excel", name = "fastexcel", version.ref = "fastexcel" }
poi-ooxml = { group = "org.apache.poi", name = "poi-ooxml", version.ref = "poi" }
poi-scratchpad = { group = "org.apache.poi", name = "poi-scratchpad", version.ref = "poi" }
powerjob-worker-starter = { group = "tech.powerjob", name = "powerjob-worker-spring-boot-starter", version.ref = "powerjob" }

# ═══════════════════════════ JWT / Jakarta / 日志 / 工具库 ═══════════════════════════
# JJWT 运行时拆分为 api + impl + gson，避免引入 Jackson 2.x 运行时栈
jjwt-api = { group = "io.jsonwebtoken", name = "jjwt-api", version.ref = "jjwt" }
jjwt-impl = { group = "io.jsonwebtoken", name = "jjwt-impl", version.ref = "jjwt" }
jjwt-gson = { group = "io.jsonwebtoken", name = "jjwt-gson", version.ref = "jjwt" }
jakarta-annotation-api = { group = "jakarta.annotation", name = "jakarta.annotation-api" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
hutool-all = { group = "cn.hutool", name = "hutool-all", version.ref = "hutool" }
bouncycastle-bcprov-jdk18on = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
# Jackson 3 由 Spring Boot BOM 托管版本，供序列化和 starter 内部配置使用
jackson-databind = { group = "tools.jackson.core", name = "jackson-databind" }

# ═══════════════════════════ 测试 ═══════════════════════════
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }

[bundles]

# 测试全家桶：所有模块通过根构建脚本统一引入
testing = ["spring-boot-starter-test", "junit-jupiter", "junit-platform-launcher"]

# core 模块公开 API：统一响应、基础实体、分页类型、当前用户 SPI、Schema/Validation 注解和 Hutool 工具
core-api = ["spring-boot-starter-json", "spring-web", "spring-data-commons", "jakarta-persistence-api", "jakarta-validation-api", "hibernate-core", "reactor-core", "micrometer-context-propagation", "swagger-annotations-jakarta", "hutool-all"]

# web 模块公开 API：WebFlux、参数校验、JPA Plus、MapStruct Plus 和接口加密默认 SM4 provider
web-api = ["spring-boot-starter-webflux", "spring-boot-starter-validation", "mapstruct-plus-spring-boot-starter", "bouncycastle-bcprov-jdk18on"]

# security 模块公开 API：WebFlux 安全链和上下文传播
security-api = ["spring-boot-starter-webflux", "spring-boot-starter-security", "micrometer-context-propagation"]

# protection 模块公开 API：WebFlux 过滤器、响应式 Redis 防护、Jackson 响应序列化和安全上下文主体识别
protection-api = ["spring-boot-starter-webflux", "spring-boot-starter-data-redis-reactive", "spring-security-core", "jackson-databind"]

# error 模块编译期自动配置依赖：不强制传递给消费方
error-compileOnly = ["spring-boot-autoconfigure", "spring-context", "spring-web"]

# security 自动配置编译期依赖：安全注解、过滤器、AOP 和 Reactor 上下文
auth-compileOnly = ["spring-boot-autoconfigure", "spring-context", "spring-web", "spring-security-core", "spring-security-web", "spring-security-config", "jackson-databind", "micrometer-context-propagation", "spring-aop", "aspectjweaver", "reactor-core", "jakarta-annotation-api"]

# log 模块编译期依赖：日志切面、SpEL、审计桥接和 Redis Plus 队列能力
log-compileOnly = ["spring-boot-autoconfigure", "spring-boot-webclient", "spring-context", "spring-expression", "spring-web", "spring-tx", "spring-aop", "aspectjweaver", "reactor-core", "micrometer-context-propagation"]

# dict 模块编译期与测试依赖：Spring Data Redis 和 Reactor 类型
dict-compileOnly = ["spring-data-redis", "spring-boot-autoconfigure", "spring-context", "reactor-core"]

# excel 模块编译期依赖：FastExcel、POI、Web 响应和 Reactor 类型
excel-compileOnly = ["fastexcel", "poi-ooxml", "poi-scratchpad", "spring-boot-autoconfigure", "spring-context", "spring-web", "reactor-core"]

# starter 内部实现依赖：自动配置、AOP、参数校验和 Jackson 3 序列化
starter-implementation = ["spring-boot-autoconfigure", "spring-core", "spring-beans", "spring-context", "spring-aop", "aspectjweaver", "spring-boot-starter-validation", "jackson-databind"]

# JJWT 运行时实现：api 模块编译可见，impl/gson 仅运行时需要
jjwt-runtime = ["jjwt-impl", "jjwt-gson"]

[plugins]

# Lombok 编译期代码生成（@Data / @Slf4j / @Builder 等）
lombok = { id = "io.freefair.lombok", version.ref = "lombok-plugin" }

# Spring Boot Gradle 插件（依赖管理、bootJar 和测试集成）
springboot = { id = "org.springframework.boot", version.ref = "spring-boot" }

# 依赖更新检查
versions = { id = "io.github.ben-manes.versions", version.ref = "versions-plugin" }
maven-publish = { id = "com.vanniktech.maven.publish.base", version.ref = "maven-publish-plugin" }
