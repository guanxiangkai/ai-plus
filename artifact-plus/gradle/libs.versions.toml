[versions]
# ProGuard 支持 Java 25 字节码；混淆只作用于消费者指定业务包。
proguard = "7.10.0"
# 与仓库其他能力族保持相同测试和 Central 发布工具基线。
junit = "6.1.3"
maven-publish = "0.37.0"
# Maven 插件使用稳定的 Maven 3 API；消费者运行 Maven 时自行提供这些 API。
maven = "3.9.16"

[libraries]
proguard = { module = "com.guardsquare:proguard-base", version.ref = "proguard" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "maven" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "maven" }

[plugins]
maven-publish = { id = "com.vanniktech.maven.publish.base", version.ref = "maven-publish" }
