name: 发布 Maven 模块

on:
  workflow_dispatch:
    inputs:
      modules:
        description: 逗号分隔的模块名；首次发布可填写 all
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: maven-package-release
  cancel-in-progress: false

jobs:
  publish:
    name: 验证并发布所选模块
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: package-release
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 校验发布来源
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "发布必须手工选择 main 分支和目标模块" >&2
            exit 1
          fi

      - name: 配置 JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: graalvm
          java-version: "25.0.4"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: 执行完整质量门禁
        run: ./gradlew buildAll generatePomAll --no-daemon --stacktrace

      - name: 核验发布元数据与回归测试报告
        run: python3 .github/scripts/verify-build.py

      - name: 发布所选模块
        env:
          RELEASE_MODULES: ${{ inputs.modules }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_KEY_ID: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          # 主密钥可自动识别；只有签名子密钥需要显式 Key ID，禁止向 Gradle 传入空值。
          if [[ -n "$MAVEN_SIGNING_KEY_ID" ]]; then
            export ORG_GRADLE_PROJECT_signingInMemoryKeyId="$MAVEN_SIGNING_KEY_ID"
          fi
          ./gradlew publishSelected -PreleaseModules="$RELEASE_MODULES" --no-daemon --stacktrace
